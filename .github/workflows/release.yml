name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci.ps1
        shell: pwsh
      - run: ./scripts/release.ps1 -Tag $env:TAG -Token $env:TOKEN
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
